name: Bug report
description: Report a reproducible AgentDock problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private transcripts, account data, absolute home-directory paths, or unredacted logs. Report vulnerabilities through the private security advisory link in SECURITY.md.
  - type: input
    id: agentdock-version
    attributes:
      label: AgentDock version
      placeholder: v0.1.1
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: macOS 15.6
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Codex
        - Claude
        - Both
        - Not provider-specific
    validations:
      required: true
  - type: input
    id: provider-version
    attributes:
      label: Provider app version
      description: Leave blank when the problem is not provider-specific.
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic names and data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, account data, private transcript content, local usernames, and absolute paths.
          required: true
